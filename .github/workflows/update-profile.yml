name: Update profile

on:
  schedule:
    - cron: "23 1 * * *"   # 06:53 IST daily; off the :00 rush
  workflow_dispatch:
  push:
    paths:
      - "tools/profile/**"
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install fonttools==4.66.1 brotli==1.2.0   # pinned: font bytes must not drift

      - name: Fetch data
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python tools/profile/fetch.py

      - name: Render
        run: python tools/profile/render.py

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets tools/profile/data README.md
          git commit -m "Refresh profile data"
          git push
