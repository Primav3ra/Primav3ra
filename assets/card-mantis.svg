 own manuals,</text><text x="72" y="140" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="start" >with page-level citations, photo reading and</text><text x="72" y="160" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="start" >step-by-step repair flowcharts.</text><text x="72" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[fastapi]</text><text x="142.1" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[next.js]</text><text x="212.2" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[gemini]</text><text x="275.4" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[moss]</text><g stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"><line x1="16" y1="0" x2="16" y2="240"/></g></svg>