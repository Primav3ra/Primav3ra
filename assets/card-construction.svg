<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" role="img" aria-labelledby="t d"><title id="t">construction-intel</title><desc id="d">construction-intel: geospatial sales intel. Turns public building-permission records into a weekly ranked lead list for cement distributors in Hyderabad, refreshed by GitHub Actions. playwright, pandas, react, leaflet.</desc><style>@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,)}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,)}@font-face{font-family:'JBM';font-weight:800;src:url(data:font/woff2;base64,)}text{font-family:'JBM',ui-monospace,monospace;white-space:pre}@media (prefers-reduced-motion:reduce){*{animation:none!important}.motion{display:none}}</style><defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(0 0)"><path d="M40 0H0V40" fill="none" stroke="#0a1620"/></pattern><filter id="glow" filterUnits="userSpaceOnUse" x="-20" y="-20" width="480" height="280"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="440" height="240" fill="#04070c"/><rect width="440" height="240" fill="url(#grid)"/><rect x="12" y="8" width="376" height="216" rx="4" fill="#06101a" stroke="#12303d" stroke-opacity="1"/><text x="32" y="44" font-size="18" fill="#c9d1d9" font-weight="400" text-anchor="start" ><tspan fill="#5b6b7e">./</tspan><tspan fill="#f0f6fc" font-weight="800">construction-intel</tspan></text><text x="32" y="68" font-size="11" fill="#22d3ee" font-weight="700" text-anchor="start" letter-spacing="1.2">GEOSPATIAL SALES INTEL</text><text x="32" y="100" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="start" >Turns public building-permission records</text><text x="32" y="120" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="start" >into a weekly ranked lead list for cement</text><text x="32" y="140" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="start" >distributors in Hyderabad, refreshed by</text><text x="32" y="160" font-size="12.5" fill="#c9d1d9" font-weight="400" text-anchor="start" >GitHub Actions.</text><text x="32" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[playwright]</text><text x="122.8" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[pandas]</text><text x="186" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[react]</text><text x="242.3" y="204" font-size="11.5" fill="#5b6b7e" font-weight="400" text-anchor="start" >[leaflet]</text><g stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"><line x1="424" y1="0" x2="424" y2="240"/></g></svg>